<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocos Games</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: #0f1115;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e6e8eb;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Mobile: fill the screen */
  #frame {
    width: 100vw;
    height: 100vh;
    border: 0;
    display: block;
    background: #000;
  }
  /* Desktop: phone-shaped portrait container */
  @media (min-width: 720px) {
    body { padding: 16px; }
    #stage {
      position: relative;
      height: calc(100vh - 32px);
      aspect-ratio: 9 / 19.5;
      max-width: calc(100vw - 32px);
      background: #000;
      border-radius: 24px;
      box-shadow: 0 12px 60px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }
    #frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    #back {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 8px 14px;
      background: #171a21;
      color: #e6e8eb;
      border: 1px solid #262a33;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      z-index: 10;
    }
    #back:hover { border-color: #3a4050; }
  }
  /* Mobile: no decorative chrome; just the game */
  @media (max-width: 719px) {
    #stage { width: 100%; height: 100%; }
    #back { display: none; }
  }
</style>
</head>
<body>
<a id="back" href="./">← 목록</a>
<div id="stage">
  <iframe id="frame" allow="autoplay; fullscreen" src="about:blank"></iframe>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const game = params.get('g');
  // simple allow-list against path traversal
  if (game && /^[a-z0-9_-]+$/i.test(game)) {
    document.getElementById('frame').src = './' + game + '/';
    document.title = 'Cocos Games · ' + game;
  } else {
    document.body.innerHTML = '<p style="padding:24px">잘못된 경로입니다. <a style="color:#9ab" href="./">목록으로</a></p>';
  }
</script>
</body>
</html>
