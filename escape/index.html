<!DOCTYPE html>
<html>
<head><script>
  // Auto-frame in mobile-portrait wrapper on desktop. Inserted by deploy tooling.
  (function(){
    if (window.self !== window.top) return; // already inside wrapper
    if (!window.matchMedia('(min-width: 720px)').matches) return; // mobile: skip
    var path = location.pathname.replace(/\/(?:index\.html?)?$/, '');
    var m = path.match(/\/([^\/]+)$/);
    if (!m) return;
    location.replace('../play.html?g=' + encodeURIComponent(m[1]));
  })();
</script>

<style>
  /* Auto-injected: force mobile-portrait framing when rendered in a wide context
     (desktop window OR external iframe). Skipped when the host is already
     narrower than 720px (mobile / play.html's phone-shaped wrapper). */
  @media (min-width: 720px) and (min-aspect-ratio: 1 / 1) {
    html, body {
      width: 100vw !important; height: 100vh !important;
      margin: 0 !important; padding: 0 !important;
      background: #0f1115 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden !important;
    }
    #GameDiv {
      aspect-ratio: 9 / 19.5 !important;
      width: auto !important;
      height: 96vh !important;
      max-width: 96vw !important;
      flex: 0 0 auto !important;
      background: #000;
      border-radius: 20px;
      overflow: hidden !important;
      box-shadow: 0 12px 60px rgba(0, 0, 0, 0.6);
    }
    #Cocos3dGameContainer, #GameCanvas {
      width: 100% !important;
      height: 100% !important;
    }
  }
</style>
</head>

  </div>

<script type="text/javascript">
(function () {
    // open web debugger console
    if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
    }

    var debug = window._CCSettings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function loadScript (moduleName, cb) {
      function scriptLoaded () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
      document.body.appendChild(domScript);
    }

    loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.66f75.js', function () {
      if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
        loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
      }
      else {
        window.boot();
      }
    });
})();
</script>
</body>
