<!DOCTYPE html>
<html>
<head><script>
  // Auto-frame in mobile-portrait wrapper on desktop. Inserted by deploy tooling.
  (function(){
    if (window.self !== window.top) return; // already inside wrapper
    if (!window.matchMedia('(min-width: 720px)').matches) return; // mobile: skip
    var path = location.pathname.replace(/\/(?:index\.html?)?$/, '');
    var m = path.match(/\/([^\/]+)$/);
    if (!m) return;
    location.replace('../play.html?g=' + encodeURIComponent(m[1]));
  })();
</script>

  <meta charset="utf-8">

  <title>Cocos Creator | 糖果消消乐-经典三消</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <link rel="stylesheet" type="text/css" href="style.css"/>

<style>
  /* Auto-injected: force mobile-portrait framing when rendered in a wide context
     (desktop window OR external iframe). Skipped when the host is already
     narrower than 720px (mobile / play.html's phone-shaped wrapper). */
  @media (min-width: 720px) and (min-aspect-ratio: 1 / 1) {
    html, body {
      width: 100vw !important; height: 100vh !important;
      margin: 0 !important; padding: 0 !important;
      background: #0f1115 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden !important;
    }
    #GameDiv {
      aspect-ratio: 9 / 19.5 !important;
      width: auto !important;
      height: 96vh !important;
      max-width: 96vw !important;
      flex: 0 0 auto !important;
      background: #000;
      border-radius: 20px;
      overflow: hidden !important;
      box-shadow: 0 12px 60px rgba(0, 0, 0, 0.6);
    }
    #Cocos3dGameContainer, #GameCanvas {
      width: 100% !important;
      height: 100% !important;
    }
  }
</style>
</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
      </div>
    </div>
  

<!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err); })
</script>

</body>
</html>
