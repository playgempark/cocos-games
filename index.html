<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocos Games</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e8eb;
    min-height: 100vh;
  }
  header {
    padding: 48px 24px 24px;
    text-align: center;
    border-bottom: 1px solid #1e2128;
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  header p { margin: 0; color: #8a92a0; font-size: 14px; }
  main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    padding: 20px;
    background: #171a21;
    border: 1px solid #262a33;
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: #3a4050; }
  .card h2 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 0; color: #8a92a0; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Cocos Games</h1>
  <p>브라우저에서 바로 플레이</p>
</header>
<main>
  <div class="grid">
    <a class="card" href="./bubble/"><h2>Bubble</h2><p>플레이하기 →</p></a>
    <a class="card" href="./carrush/"><h2>Car Rush</h2><p>플레이하기 →</p></a>
    <a class="card" href="./elimi/"><h2>Elimi</h2><p>플레이하기 →</p></a>
    <a class="card" href="./game05_tt/"><h2>Game05_tt</h2><p>플레이하기 →</p></a>
    <a class="card" href="./game1/"><h2>Game1</h2><p>플레이하기 →</p></a>
    <a class="card" href="./gogohak/"><h2>Gogohak</h2><p>플레이하기 →</p></a>
    <a class="card" href="./health5s/"><h2>Health 5s</h2><p>플레이하기 →</p></a>
    <a class="card" href="./movebrick/"><h2>Move Brick</h2><p>플레이하기 →</p></a>
    <a class="card" href="./plant/"><h2>Plant</h2><p>플레이하기 →</p></a>
    <a class="card" href="./screws/"><h2>Screws</h2><p>플레이하기 →</p></a>
    <a class="card" href="./tingche/"><h2>Tingche</h2><p>플레이하기 →</p></a>
    <a class="card" href="./yishengmoniqi/"><h2>Yishengmoniqi</h2><p>플레이하기 →</p></a>
  </div>
</main>
</body>
</html>
